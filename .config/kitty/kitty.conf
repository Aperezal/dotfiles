#######################################################################
#                 KITTY CONFIGURATION (Hyprland Edition)              #
#######################################################################

# ---------------------------------------------------------------------
# 1. FONTS
# ---------------------------------------------------------------------
font_family      HackNerdFont
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
# Always enable ligatures (e.g., => turns into an arrow)
disable_ligatures never

# ---------------------------------------------------------------------
# 2. WINDOW & APPEARANCE
# ---------------------------------------------------------------------
background_opacity 0.90

# Inner margin to prevent text from touching edges (Aesthetic for tiling WMs)
window_padding_width 10

# Hide title bar (handled by Hyprland)
hide_window_decorations yes

# Disable confirmation when closing a window
confirm_os_window_close 0

# Cursor customization
cursor_shape beam
cursor_beam_thickness 1.8
mouse_hide_wait 3.0

# ---------------------------------------------------------------------
# 3. SCROLLBACK & PAGER (NEOVIM POWER)
# ---------------------------------------------------------------------
# Increase history size to 10k lines
scrollback_lines 10000

# --- The "Magic" Command ---
# 1. Opens Nvim.
# 2. Writes history to a temp file.
# 3. Opens a terminal buffer inside Nvim running 'bat' for syntax coloring.
# 4. 'normal G': Jumps to the end of the file automatically.
# 5. '1bd!': Deletes the raw buffer containing garbage characters.
scrollback_pager nvim -c "set nonumber nolist showtabline=0 foldcolumn=0 laststatus=0" -c "autocmd TermOpen * normal G" -c "silent write! /tmp/kitty_log | terminal bat --paging=never --style=plain --color=always /tmp/kitty_log" -c "1bd!" -

# ---------------------------------------------------------------------
# 4. TAB BAR
# ---------------------------------------------------------------------
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge bottom
tab_bar_margin_width 0.0

# Tab Colors (Matched to Catppuccin)
active_tab_foreground   #11111b
active_tab_background   #a6e3a1
active_tab_font_style   bold
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
inactive_tab_font_style normal

# ---------------------------------------------------------------------
# 5. BEHAVIOR & PERFORMANCE
# ---------------------------------------------------------------------
enable_audio_bell no
detect_urls yes
url_style curly
sync_to_monitor yes
shell zsh

# ---------------------------------------------------------------------
# 6. KEYBINDINGS
# ---------------------------------------------------------------------
# --- Window Navigation ---
map ctrl+left  neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up    neighboring_window up
map ctrl+down  neighboring_window down

# --- Clipboard Buffers (F1-F4) ---
map f1 copy_to_buffer a
map f2 paste_from_buffer a
map f3 copy_to_buffer b
map f4 paste_from_buffer b

# --- Window & Tab Management ---
map ctrl+shift+z toggle_layout stack
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd

# --- Scrollback Trigger ---
map ctrl+shift+h show_scrollback

#######################################################################
#            THEME: CATPPUCCIN MOCHA (Direct Integration)             #
#######################################################################

